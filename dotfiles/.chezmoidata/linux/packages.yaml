packages:
  apt:
    - name: sudo
    - name: nano
    - name: git
    - name: git-delta
    - name: git-lfs
    - name: curl
    - name: unzip
    - name: console-setup
    - name: qemu-guest-agent
    - name: make
    - name: build-essential
    - name: libssl-dev
    - name: zlib1g-dev
    - name: libbz2-dev
    - name: libreadline-dev
    - name: libsqlite3-dev
    - name: curl
    - name: git
    - name: libncurses-dev
    - name: xz-utils
    - name: tk-dev
    - name: libxml2-dev
    - name: libxmlsec1-dev
    - name: libffi-dev
    - name: liblzma-dev
    - name: bat
  curl:
    - name: pyenv
      url: https://pyenv.run
      pre_install:
        - export PYENV_ROOT="$HOME/.local/share/pyenv"
        - export PATH="$PYENV_ROOT/bin:$PATH"
      post_install:
        - eval "$(pyenv init - bash)"
        - pyenv install 3
        - pyenv global 3
        - echo "[pyenv] Python instalado $(python --version 2>&1)"
  pip:
    - name: pipx
  pipx: []
  symbolic_link:
    - name: ~/.local/bin/bat
      target: /usr/bin/batcat
