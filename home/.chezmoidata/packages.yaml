packages:
  linux:
    apt:
      - name: sudo
      - name: nano
      - name: git
      - name: git-delta
      - name: git-lfs
      - name: curl
      - name: unzip
      - name: console-setup
      - name: qemu-guest-agent
      - name: make
      - name: build-essential
      - name: libssl-dev
      - name: zlib1g-dev
      - name: libbz2-dev
      - name: libreadline-dev
      - name: libsqlite3-dev
      - name: curl
      - name: git
      - name: libncurses-dev
      - name: xz-utils
      - name: tk-dev
      - name: libxml2-dev
      - name: libxmlsec1-dev
      - name: libffi-dev
      - name: liblzma-dev
      - name: bat
        post_install:
          - if ! command -v "bat" &>/dev/null && command -v "batcat" &>/dev/null; then ([ ! -f "$XDG_BIN_HOME/bat" ] && ln -sf "/usr/bin/batcat" "$XDG_BIN_HOME/bat"); fi
      - name: socat
    curl:
      - name: pyenv
        url: https://pyenv.run
        pre_install:
          - export PYENV_ROOT="$XDG_DATA_HOME/pyenv"
          - export PATH="$PYENV_ROOT/bin:$PATH"
        post_install:
          - eval "$(pyenv init - bash)"
          - pyenv install 3
          - pyenv global 3
          - echo "[pyenv] Python instalado $(python --version 2>&1)"
      - name: fnm
        url: https://fnm.vercel.app/install
        args: --install-dir "$XDG_BIN_HOME" --skip-shell
        post_install:
          - export FNM_DIR="$XDG_DATA_HOME/fnm"
          - eval "$(fnm env --use-on-cd --shell bash)"
    pip:
      - name: pipx
    pipx: []
  windows:
    winget:
      - name: Microsoft.PowerShell
      - name: Microsoft.PowerToys
      - name: Microsoft.VisualStudioCode
      - name: 7zip.7zip
      - name: Git.Git
      - name: voidtools.Everything
      - name: Google.Chrome
      - name: Bitwarden.Bitwarden
      - name: Schniz.fnm
      - name: dandavison.delta
      - name: ShareX.ShareX
      - name: GitHub.cli
      - name: jftuga.less
      - name: sharkdp.bat
      - name: albertony.npiperelay
    invoke_web_request:
      - name: pyenv
        url: https://raw.githubusercontent.com/pyenv-win/pyenv-win/master/pyenv-win/install-pyenv-win.ps1
        out_file: $HOME\install-pyenv-win.ps1
        post_install:
          - mv "$HOME\.pyenv" "$env:XDG_DATA_HOME\pyenv"
          - psenv set "PYENV" "%XDG_DATA_HOME%\pyenv\pyenv-win" -Type ExpandString
          - psenv set "PYENV_HOME" "%XDG_DATA_HOME%\pyenv\pyenv-win" -Type ExpandString
          - psenv set "PYENV_ROOT" "%XDG_DATA_HOME%\pyenv\pyenv-win" -Type ExpandString
          - psenv remove-path "$HOME\.pyenv\pyenv-win\bin"
          - psenv remove-path "$HOME\.pyenv\pyenv-win\shims"
          - psenv add-path "$env:PYENV_ROOT\bin"
          - psenv add-path "$env:PYENV_ROOT\shims"
          - pyenv install 3
          - pyenv global 3
          - Write-Host "[pyenv-win] Python instalado $(python --version 2>&1)" -ForegroundColor Green
    pip:
      - name: pipx
    pipx: []
